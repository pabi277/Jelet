<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F6E66" />
  <meta name="description" content="JELET Study Hub (v3) — 100%-accurate, phone-first offline PWA for WBJEEB JELET Paper-I." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icons/pwa-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JELET Hub" />
  <title>JELET Study Hub (v3)</title>

  <!-- Design tokens are the SINGLE source of truth for all colors. -->
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/vendor/katex/katex.css" />
  <link rel="stylesheet" href="./assets/css/shell.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
</head>
  <body>
    <a class="skip-link" href="#appMain">Skip to main content</a>
    <div class="app-shell">

    <!-- ===== Top bar ===== -->
    <header class="topbar">
      <div class="topbar__title" id="topbarTitle">Today</div>
      <button class="btn btn--ghost" id="themeToggle" type="button" aria-pressed="false" aria-label="Toggle AMOLED dark mode" title="Toggle AMOLED dark mode">
        <svg class="ico" aria-hidden="true"><use href="./assets/icons/icons.svg#icon-moon"/></svg>
      </button>
    </header>

    <!-- ===== Main content (router target) ===== -->
    <main class="app-main" id="appMain" role="main"></main>

    <!-- ===== Bottom sheet overlay + OMR palette primitive ===== -->
    <div class="sheet-overlay" id="sheetOverlay" hidden></div>
    <section class="bottom-sheet" id="omrSheet" role="dialog" aria-modal="true" aria-label="Question palette" aria-hidden="true">
      <div class="bottom-sheet__handle" aria-hidden="true"></div>
      <div class="bottom-sheet__header">
        <h2 class="bottom-sheet__title">Question Palette · 100 Qs</h2>
        <button class="btn btn--ghost" id="closeSheetBtn" type="button" aria-label="Close sheet">
          <svg class="ico" aria-hidden="true"><use href="./assets/icons/icons.svg#icon-close"/></svg>
        </button>
      </div>
      <div class="bottom-sheet__body">
        <div class="omr-grid" id="omrGrid" aria-label="Question grid"></div>
      </div>
    </section>

    <!-- ===== Scoped, Corpus-Grounded Codec AI Tutor Sheet ===== -->
    <section class="bottom-sheet ai-sheet" id="aiSheet" role="dialog" aria-modal="true" aria-label="Codec AI Tutor" aria-hidden="true">
      <div class="bottom-sheet__handle" aria-hidden="true"></div>
      <div class="bottom-sheet__header ai-sheet__header">
        <button class="btn btn--ghost ai-header-icon" id="closeAiSheetBtn" type="button" aria-label="Close AI Tutor">
          <svg class="ico" aria-hidden="true"><use href="./assets/icons/icons.svg#icon-back"/></svg>
        </button>
        <button class="btn btn--ghost ai-header-icon ai-history-trigger" id="aiHistoryBtn" type="button" aria-label="Conversation history" aria-expanded="false" aria-controls="aiHistoryDrawer">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="ai-header-title">
          <h2 class="bottom-sheet__title">Codec AI Tutor</h2>
          <span id="aiSheetModeBadge">Corpus Tutor · Offline</span>
        </div>
        <button class="btn btn--ghost btn--sm ai-pin-btn" id="aiPinBtn" type="button" aria-pressed="false">Pin</button>
        <span class="ai-header-avatar" aria-hidden="true"><svg class="ico"><use href="./assets/icons/icons.svg#icon-spark"/></svg></span>
      </div>
      <div class="bottom-sheet__body ai-sheet__body" id="aiSheetBody"></div>
    </section>

    <!-- ===== 5-tab bottom navigation ===== -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Primary"></nav>
  </div>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
