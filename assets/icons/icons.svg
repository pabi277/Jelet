<?xml version="1.0" encoding="UTF-8"?>
<!--
  icons.svg — JELET Study Hub (v3) · Unified icon sprite
  All icons share a single 24x24 viewBox, stroke="currentColor",
  fill="none", stroke-width="1.75" (crisp, theme-adaptive via currentColor).
  Reference inline with:  <svg><use href="./assets/icons/icons.svg#icon-today"/></svg>
  Mockup chrome (bezels, notches, fake status bars) is NEVER rendered.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- ===== Navigation (5 global destinations) ===== -->
