<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="2022 Q55: Isobaric P-V diagram">
  <rect x="0" y="0" width="240" height="200" fill="transparent"/>
  <text x="15" y="20" font-family="monospace" font-size="11" fill="var(--fig-text)">2022 Q55: Isobaric P-V diagram</text>
  <text x="40" y="25" font-family="monospace" font-size="10" fill="var(--fig-text-light)" text-anchor="start">P-V diagram (isobaric)</text>
