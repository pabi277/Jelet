  <text x="40" y="25" font-family="monospace" font-size="10" fill="var(--fig-text-light)" text-anchor="start">V-T diagram (cycle)</text>
  <line x1="40" y1="160" x2="200" y2="160" stroke="var(--fig-axis)" stroke-width="1.5"/>
