<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220" role="img" aria-label="2023 Q48: PV diagram">
  <rect x="0" y="0" width="240" height="220" fill="transparent"/>
  <text x="15" y="20" font-family="monospace" font-size="11" fill="var(--fig-axis)">2023 Q48: PV diagram</text>
  <text x="40" y="25" font-family="monospace" font-size="10" fill="var(--fig-text)" text-anchor="start">P-V diagram</text>
  <line x1="40" y1="160" x2="200" y2="160" stroke="var(--fig-line)" stroke-width="1.5"/>
  <line x1="40" y1="40" x2="40" y2="160" stroke="var(--fig-line)" stroke-width="1.5"/>
  <path d="M 60 50 Q 100 70, 180 120" stroke="var(--fig-secondary)" stroke-width="2" fill="none"/>
  <path d="M 180 150 Q 130 100, 60 50" stroke="var(--fig-danger)" stroke-width="2" fill="none"/>
  <circle cx="60" cy="50" r="4" fill="var(--fig-danger)"/>
  <text x="45" y="42" font-family="monospace" font-size="10" fill="var(--fig-danger-soft)" text-anchor="start">A</text>
  <circle cx="180" cy="120" r="4" fill="var(--fig-secondary)"/>
  <text x="185" y="115" font-family="monospace" font-size="10" fill="var(--fig-secondary-soft)" text-anchor="start">B</text>
  <circle cx="180" cy="150" r="4" fill="var(--fig-accent)"/>
  <text x="185" y="165" font-family="monospace" font-size="10" fill="var(--fig-accent-tint)" text-anchor="start">C</text>
  <text x="30" y="165" font-family="monospace" font-size="10" fill="var(--fig-axis)" text-anchor="start">V</text>
  <text x="20" y="50" font-family="monospace" font-size="10" fill="var(--fig-axis)" text-anchor="start">P</text>
  <text x="120" y="180" font-family="monospace" font-size="8" fill="var(--fig-axis)" text-anchor="middle">BA: isothermal, CA: adiabatic</text>
</svg>