<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 172" width="290" height="172" role="img" aria-label="2023 Q70: Young's double slit; slits S1 above S2 separated by b in a vertical barrier; a screen at distance d; point P on the screen level with S1; dashed lines S1P and S2P">
  <rect x="0" y="0" width="290" height="172" fill="transparent"/>
  <line data-role="barrier" x1="70" y1="18" x2="70" y2="72" stroke="var(--fig-line)" stroke-width="1.5"/>
  <line x1="70" y1="80" x2="70" y2="100" stroke="var(--fig-line)" stroke-width="1.5"/>
  <line x1="70" y1="108" x2="70" y2="160" stroke="var(--fig-line)" stroke-width="1.5"/>
  <line data-role="screen" x1="236" y1="22" x2="236" y2="158" stroke="var(--fig-line)" stroke-width="1.5"/>
  <line data-role="S1P" x1="70" y1="76" x2="236" y2="76" stroke="var(--fig-axis)" stroke-width="0.9" stroke-dasharray="3,2.5"/>
  <line data-role="S2P" x1="70" y1="104" x2="236" y2="76" stroke="var(--fig-axis)" stroke-width="0.9" stroke-dasharray="3,2.5"/>
  <line data-role="b" x1="44" y1="78" x2="44" y2="102" stroke="var(--fig-line)" stroke-width="1.0"/>
  <polygon points="44.0,77.0 41.5,82.0 46.5,82.0" fill="var(--fig-line)"/>
  <polygon points="44.0,103.0 46.5,98.0 41.5,98.0" fill="var(--fig-line)"/>
  <text x="36" y="95" font-family="Times New Roman, serif" font-size="13" fill="var(--fig-text)" text-anchor="middle">b</text>
  <text x="50" y="78" font-family="Times New Roman, serif" font-size="12" fill="var(--fig-text)" text-anchor="start">S<tspan dy="3" font-size="8">1</tspan></text>
  <text x="50" y="112" font-family="Times New Roman, serif" font-size="12" fill="var(--fig-text)" text-anchor="start">S<tspan dy="3" font-size="8">2</tspan></text>
  <text x="152" y="70" font-family="Times New Roman, serif" font-size="13" fill="var(--fig-text)" text-anchor="middle">d</text>
