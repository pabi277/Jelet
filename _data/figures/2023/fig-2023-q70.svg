<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="2023 Q70: Young's double slit">
  <rect x="0" y="0" width="240" height="200" fill="transparent"/>
  <text x="15" y="20" font-family="monospace" font-size="11" fill="var(--fig-text)">2023 Q70: Young's double slit</text>
  <text x="40" y="25" font-family="monospace" font-size="10" fill="var(--fig-text-light)" text-anchor="start">Young's double slit</text>
  <circle cx="30" cy="100" r="4" fill="var(--fig-primary)"/>
  <text x="25" y="90" font-family="monospace" font-size="9" fill="var(--fig-text-light)" text-anchor="start">S</text>
  <line x1="80" y1="70" x2="80" y2="80" stroke="var(--fig-primary)" stroke-width="3"/>
  <line x1="80" y1="120" x2="80" y2="130" stroke="var(--fig-primary)" stroke-width="3"/>
  <text x="75" y="65" font-family="monospace" font-size="8" fill="var(--fig-primary)" text-anchor="start">S₁</text>
  <text x="75" y="140" font-family="monospace" font-size="8" fill="var(--fig-primary)" text-anchor="start">S₂</text>
  <line x1="80" y1="75" x2="180" y2="100" stroke="var(--fig-primary)" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="125" x2="180" y2="100" stroke="var(--fig-primary)" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="180" y1="50" x2="180" y2="150" stroke="var(--fig-axis)" stroke-width="2"/>
  <text x="185" y="55" font-family="monospace" font-size="8" fill="var(--fig-text)" text-anchor="start">Screen</text>
  <circle cx="180" cy="100" r="5" fill="var(--fig-negative)"/>
  <text x="185" y="103" font-family="monospace" font-size="9" fill="var(--fig-neg-light)" text-anchor="start">P</text>
  <text x="120" y="170" font-family="monospace" font-size="8" fill="var(--fig-text)" text-anchor="middle">b = slit separation, d = screen distance</text>
</svg>