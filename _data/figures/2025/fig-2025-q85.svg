<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="JELET 2025 Q85: HC≡CH reaction scheme">
  <rect x="0" y="0" width="420" height="220" fill="transparent"/>
  <text x="20" y="22" font-family="var(--font-mono)" font-size="12" fill="var(--fig-text)">Q85: HC≡CH → NaNH₂/liq.NH₃ → Ethylbromide (excess)</text>
  <text x="60" y="100" font-family="var(--font-mono)" font-size="12" fill="var(--fig-curve-a)">HC≡CH</text>
  <line x1="130" y1="100" x2="200" y2="100" stroke="var(--fig-axis)" stroke-width="2" marker-end="url(#arrowhead85)"/>
  <defs>
    <marker id="arrowhead85" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="var(--fig-axis)"/>
    </marker>
  </defs>
  <text x="165" y="85" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)" text-anchor="middle">(i) NaNH₂/liq.NH₃</text>
  <text x="165" y="115" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)" text-anchor="middle">(ii) Ethylbromide (excess)</text>
  <text x="260" y="100" font-family="var(--font-mono)" font-size="12" fill="var(--fig-curve-b)">Product</text>
</svg>