  <text x="40" y="30" font-family="monospace" font-size="10" fill="var(--fig-text-light)" text-anchor="start">Reaction sequence</text>
  <rect x="30" y="55" width="50" height="35" fill="none" stroke="var(--fig-primary)" stroke-width="1.5"/>
  <text x="55" y="78" font-family="monospace" font-size="10" fill="var(--fig-text-light)" text-anchor="middle">HC≡CH</text>
  <line x1="85" y1="72" x2="125" y2="72" stroke="var(--fig-negative)" stroke-width="2"/>
