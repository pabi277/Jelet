<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="JELET 2025 Q100: logic gate combination">
  <rect x="0" y="0" width="420" height="220" fill="transparent"/>
  <text x="20" y="22" font-family="var(--font-mono)" font-size="12" fill="var(--fig-text)">Q100: Logic gate combination</text>
  <!-- Inputs A and B -->
  <line x1="40" y1="60" x2="100" y2="60" stroke="var(--fig-axis)" stroke-width="2"/>
  <line x1="40" y1="160" x2="100" y2="160" stroke="var(--fig-axis)" stroke-width="2"/>
  <text x="30" y="55" font-family="var(--font-mono)" font-size="11" fill="var(--fig-curve-a)">A</text>
  <text x="30" y="155" font-family="var(--font-mono)" font-size="11" fill="var(--fig-curve-b)">B</text>
  <!-- NAND gate (first) -->
  <path d="M 100,40 L 160,40 A 30,30 0 0 1 160,100 L 100,100 Z" stroke="var(--fig-curve-a)" stroke-width="2" fill="none"/>
  <line x1="160" y1="70" x2="200" y2="70" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <text x="130" y="80" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)" text-anchor="middle">NAND</text>
  <!-- NOT gate (inverter) on B path -->
  <line x1="100" y1="160" x2="140" y2="160" stroke="var(--fig-axis)" stroke-width="2"/>
  <circle cx="155" cy="160" r="12" stroke="var(--fig-curve-b)" stroke-width="2" fill="none"/>
  <line x1="167" y1="160" x2="200" y2="160" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <!-- AND gate (second) -->
  <path d="M 200,50 L 260,50 A 30,25 0 0 1 260,100 L 200,100 Z" stroke="var(--fig-curve-c)" stroke-width="2" fill="none"/>
  <line x1="200" y1="70" x2="220" y2="70" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="200" y1="160" x2="220" y2="160" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <text x="230" y="80" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)" text-anchor="middle">AND</text>
  <!-- Output -->
  <line x1="260" y1="75" x2="340" y2="75" stroke="var(--fig-curve-d)" stroke-width="2"/>
  <polygon points="340,75 332,70 332,80" fill="var(--fig-curve-d)"/>
  <text x="350" y="78" font-family="var(--font-mono)" font-size="11" fill="var(--fig-curve-d)">Y</text>
</svg>