<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="JELET 2025 Q44: acceleration-time graph">
  <rect x="0" y="0" width="420" height="220" fill="transparent"/>
  <text x="20" y="22" font-family="var(--font-mono)" font-size="12" fill="var(--fig-text)">Q44: Acceleration vs Time</text>
  <!-- a-t graph: constant a then zero -->
  <line x1="60" y1="60" x2="360" y2="60" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="360" y1="60" x2="360" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="360" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <text x="375" y="65" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)">a (m/s²)</text>
  <text x="200" y="198" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)" text-anchor="middle">t (s)</text>
  <text x="68" y="175" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)">0</text>
  <!-- constant acceleration segment -->
  <line x1="80" y1="100" x2="200" y2="100" stroke="var(--fig-curve-a)" stroke-width="2.5"/>
  <!-- zero acceleration segment -->
  <line x1="200" y1="100" x2="200" y2="100" stroke="var(--fig-axis)" stroke-width="1"/>
  <line x1="200" y1="180" x2="340" y2="180" stroke="var(--fig-curve-a)" stroke-width="2.5"/>
  <text x="140" y="92" font-family="var(--font-mono)" font-size="10" fill="var(--fig-curve-a)" text-anchor="middle">a = const</text>
  <text x="270" y="173" font-family="var(--font-mono)" font-size="10" fill="var(--fig-curve-a)" text-anchor="middle">a = 0</text>
  <text x="200" y="118" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)" text-anchor="middle">t₀</text>
</svg>
