<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="JELET 2025 Q67: block and pulley system">
  <rect x="0" y="0" width="420" height="220" fill="transparent"/>
  <text x="20" y="22" font-family="var(--font-mono)" font-size="12" fill="var(--fig-text)">Q67: Block over pulley with force F</text>
  <!-- Ceiling -->
  <line x1="40" y1="50" x2="380" y2="50" stroke="var(--fig-axis)" stroke-width="2"/>
  <!-- Pulley -->
  <circle cx="200" cy="50" r="12" stroke="var(--fig-axis)" stroke-width="2" fill="none"/>
  <!-- String over pulley -->
  <line x1="200" y1="38" x2="100" y2="120" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="200" y1="38" x2="300" y2="100" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <!-- Block (2kg) on left -->
  <rect x="80" y="120" width="40" height="40" rx="3" stroke="var(--fig-curve-a)" stroke-width="2" fill="none"/>
  <text x="100" y="145" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)" text-anchor="middle">2kg</text>
  <!-- Force F on right -->
  <line x1="300" y1="100" x2="300" y2="170" stroke="var(--fig-curve-b)" stroke-width="2.5"/>
  <polygon points="300,170 293,160 307,160" fill="var(--fig-curve-b)"/>
  <text x="325" y="140" font-family="var(--font-mono)" font-size="11" fill="var(--fig-curve-b)">F=40N</text>
  <text x="100" y="175" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)" text-anchor="middle">block</text>
</svg>