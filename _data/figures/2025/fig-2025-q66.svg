<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="JELET 2025 Q66: x-t graph for car">
  <rect x="0" y="0" width="420" height="220" fill="transparent"/>
  <text x="20" y="22" font-family="var(--font-mono)" font-size="12" fill="var(--fig-text)">Q66: Displacement vs Time (car)</text>
  <line x1="60" y1="60" x2="360" y2="60" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="360" y1="60" x2="360" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="360" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <text x="375" y="65" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)">x</text>
  <text x="200" y="198" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)" text-anchor="middle">t</text>
  <!-- Parabolic (accelerating) for first 4s, then linear (uniform velocity) -->
  <path d="M 60,180 Q 120,140 180,80" stroke="var(--fig-curve-a)" stroke-width="2.5" fill="none"/>
  <line x1="180" y1="80" x2="340" y2="80" stroke="var(--fig-curve-b)" stroke-width="2.5"/>
  <line x1="180" y1="80" x2="180" y2="180" stroke="var(--fig-axis-light)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="120" y="110" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)" text-anchor="middle">parabolic</text>
  <text x="260" y="72" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)" text-anchor="middle">linear</text>
  <text x="180" y="195" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)" text-anchor="middle">4s</text>
</svg>