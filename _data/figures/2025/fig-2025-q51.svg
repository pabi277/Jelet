<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="JELET 2025 Q51: v-t graph for sphere in viscous fluid">
  <rect x="0" y="0" width="420" height="220" fill="transparent"/>
  <text x="20" y="22" font-family="var(--font-mono)" font-size="12" fill="var(--fig-text)">Q51: Velocity vs Time (viscous fluid)</text>
  <line x1="60" y1="60" x2="360" y2="60" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="360" y1="60" x2="360" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="360" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <text x="375" y="65" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)">v</text>
  <text x="200" y="198" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)" text-anchor="middle">t</text>
  <!-- velocity increases with decreasing slope, asymptotes to terminal velocity -->
  <path d="M 60,180 C 100,140 150,110 220,90 C 300,75 340,72 360,72" stroke="var(--fig-curve-a)" stroke-width="2.5" fill="none"/>
  <line x1="60" y1="72" x2="360" y2="72" stroke="var(--fig-curve-d)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="200" y="66" font-family="var(--font-mono)" font-size="9" fill="var(--fig-curve-d)" text-anchor="middle">terminal v</text>
</svg>