<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img" aria-label="2025 Q61: Three liquids">
  <rect x="0" y="0" width="240" height="180" fill="transparent"/>
  <text x="15" y="20" font-family="monospace" font-size="11" fill="var(--fig-axis)">2025 Q61: Three liquids</text>
  <text x="40" y="30" font-family="monospace" font-size="10" fill="var(--fig-text)" text-anchor="start">Liquids A, B, C</text>
  <rect x="50" y="50" width="140" height="30" fill="var(--fig-primary)" fill-opacity="0.2" stroke="var(--fig-primary)" stroke-width="1.5"/>
  <text x="60" y="70" font-family="monospace" font-size="12" fill="var(--fig-primary)" text-anchor="start">A</text>
  <rect x="50" y="90" width="140" height="30" fill="var(--fig-secondary)" fill-opacity="0.2" stroke="var(--fig-secondary)" stroke-width="1.5"/>
  <text x="60" y="110" font-family="monospace" font-size="12" fill="var(--fig-secondary)" text-anchor="start">B</text>
  <rect x="50" y="130" width="140" height="30" fill="var(--fig-accent)" fill-opacity="0.2" stroke="var(--fig-accent)" stroke-width="1.5"/>
