<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="JELET 2025 Q61: three liquids mixing">
  <rect x="0" y="0" width="420" height="220" fill="transparent"/>
  <text x="20" y="22" font-family="var(--font-mono)" font-size="12" fill="var(--fig-text)">Q61: Three liquids A, B, C</text>
  <!-- Beaker A -->
  <rect x="50" y="60" width="80" height="120" rx="4" stroke="var(--fig-axis)" stroke-width="2" fill="none"/>
  <text x="90" y="50" font-family="var(--font-mono)" font-size="11" fill="var(--fig-label)" text-anchor="middle">A</text>
  <text x="90" y="130" font-family="var(--font-mono)" font-size="10" fill="var(--fig-curve-a)" text-anchor="middle">10°C</text>
  <!-- Beaker B -->
  <rect x="170" y="60" width="80" height="120" rx="4" stroke="var(--fig-axis)" stroke-width="2" fill="none"/>
  <text x="210" y="50" font-family="var(--font-mono)" font-size="11" fill="var(--fig-label)" text-anchor="middle">B</text>
  <text x="210" y="130" font-family="var(--font-mono)" font-size="10" fill="var(--fig-curve-b)" text-anchor="middle">15°C</text>
  <!-- Beaker C -->
  <rect x="290" y="60" width="80" height="120" rx="4" stroke="var(--fig-axis)" stroke-width="2" fill="none"/>
  <text x="330" y="50" font-family="var(--font-mono)" font-size="11" fill="var(--fig-label)" text-anchor="middle">C</text>
  <text x="330" y="130" font-family="var(--font-mono)" font-size="10" fill="var(--fig-curve-c)" text-anchor="middle">20°C</text>
  <text x="90" y="200" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)" text-anchor="middle">equal masses</text>
</svg>