<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="JELET 2025 Q58: P-V diagram">
  <rect x="0" y="0" width="420" height="220" fill="transparent"/>
  <text x="20" y="22" font-family="var(--font-mono)" font-size="12" fill="var(--fig-text)">Q58: P-V diagram (isothermal + isobaric)</text>
  <line x1="70" y1="170" x2="360" y2="170" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="70" y1="170" x2="70" y2="40" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <text x="365" y="175" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)">V</text>
  <text x="60" y="35" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)">P</text>
  <!-- Isothermal expansion: hyperbola from (V, P_A) to (3V, P_A/3) -->
  <path d="M 90,50 C 140,80 200,110 270,150" stroke="var(--fig-curve-a)" stroke-width="2.5" fill="none"/>
  <!-- Isobaric compression: horizontal line at P_A/3 from 3V to V -->
  <line x1="270" y1="150" x2="150" y2="150" stroke="var(--fig-curve-b)" stroke-width="2.5"/>
  <circle cx="90" cy="50" r="4" fill="var(--fig-curve-a)"/>
  <circle cx="270" cy="150" r="4" fill="var(--fig-curve-a)"/>
  <text x="80" y="45" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)">A</text>
  <text x="280" y="145" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)">B</text>
  <text x="120" y="165" font-family="var(--font-mono)" font-size="8" fill="var(--fig-label)">V</text>
  <text x="255" y="165" font-family="var(--font-mono)" font-size="8" fill="var(--fig-label)">3V</text>
</svg>