<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="JELET 2025 Q46: displacement-time graph">
  <rect x="0" y="0" width="420" height="220" fill="transparent"/>
  <text x="20" y="22" font-family="var(--font-mono)" font-size="12" fill="var(--fig-text)">Q46: Displacement vs Time</text>
  <line x1="60" y1="60" x2="360" y2="60" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="360" y1="60" x2="360" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="360" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <text x="375" y="65" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)">x</text>
  <text x="200" y="198" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)" text-anchor="middle">t</text>
  <!-- Displacement curve: A(0) -> B(up) -> C(flat) -> D(up) -> E(flat) -->
  <polyline points="60,180 110,140 160,140 210,100 260,100" stroke="var(--fig-curve-a)" stroke-width="2.5" fill="none"/>
  <text x="110" y="135" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)" text-anchor="middle">A</text>
  <text x="160" y="135" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)" text-anchor="middle">B</text>
  <text x="185" y="135" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)" text-anchor="middle">C</text>
  <text x="210" y="95" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)" text-anchor="middle">D</text>
  <text x="260" y="95" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)" text-anchor="middle">E</text>
</svg>
