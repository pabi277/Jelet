<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 125" width="260" height="125" role="img" aria-label="2025 Q44 option D: v–t graph, trapezium rising linearly from 0 to t = 1, constant from t = 1 to t = 2, then falling linearly to zero">
  <rect x="0" y="0" width="260" height="125" fill="transparent"/>
  <line x1="52" y1="100" x2="210" y2="100" stroke="var(--fig-axis)" stroke-width="1.2"/>
  <polygon points="210,100 203.1,104.0 203.1,96.0" fill="var(--fig-axis)"/>
  <line x1="60" y1="108" x2="60" y2="12" stroke="var(--fig-axis)" stroke-width="1.2"/>
  <polygon points="60,12 64.0,18.9 56.0,18.9" fill="var(--fig-axis)"/>
  <text x="34" y="30" font-family="Times New Roman, serif" font-size="12" fill="var(--fig-text)" text-anchor="middle">v</text>
  <text x="34" y="45" font-family="Times New Roman, serif" font-size="11" fill="var(--fig-text)" text-anchor="middle">(m/s)</text>
  <text x="216" y="104" font-family="Times New Roman, serif" font-size="12" font-style="italic" fill="var(--fig-text)" text-anchor="start">t</text>
  <text x="221" y="104" font-family="Times New Roman, serif" font-size="12" fill="var(--fig-text)" text-anchor="start">(s)</text>
  <polyline points="60,100 100,50 140,50 168.0,100" stroke="var(--fig-primary)" stroke-width="1.6" fill="none"/>
  <line x1="100" y1="100" x2="100" y2="50" stroke="var(--fig-line)" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="140" y1="100" x2="140" y2="50" stroke="var(--fig-line)" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="52" y="115" font-family="Times New Roman, serif" font-size="12" fill="var(--fig-text)" text-anchor="middle">0</text>
  <text x="100" y="115" font-family="Times New Roman, serif" font-size="12" fill="var(--fig-text)" text-anchor="middle">1</text>
  <text x="140" y="115" font-family="Times New Roman, serif" font-size="12" fill="var(--fig-text)" text-anchor="middle">2</text>
</svg>