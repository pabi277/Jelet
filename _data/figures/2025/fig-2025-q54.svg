<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="JELET 2025 Q54: disc rolling up incline">
  <rect x="0" y="0" width="420" height="220" fill="transparent"/>
  <text x="20" y="22" font-family="var(--font-mono)" font-size="12" fill="var(--fig-text)">Q54: Disc rolling up an incline</text>
  <!-- Horizontal surface -->
  <line x1="40" y1="170" x2="200" y2="170" stroke="var(--fig-axis)" stroke-width="2"/>
  <!-- Inclined plane -->
  <line x1="200" y1="170" x2="380" y2="80" stroke="var(--fig-axis)" stroke-width="2"/>
  <!-- Disc on horizontal surface -->
  <circle cx="120" cy="150" r="20" stroke="var(--fig-curve-a)" stroke-width="2.5" fill="none"/>
  <line x1="120" y1="150" x2="135" y2="150" stroke="var(--fig-curve-a)" stroke-width="2"/>
  <line x1="120" y1="150" x2="120" y2="135" stroke="var(--fig-curve-a)" stroke-width="2"/>
  <!-- Disc on incline -->
  <circle cx="260" cy="128" r="18" stroke="var(--fig-curve-b)" stroke-width="2.5" fill="none"/>
  <line x1="260" y1="128" x2="272" y2="128" stroke="var(--fig-curve-b)" stroke-width="2"/>
  <line x1="260" y1="128" x2="260" y2="116" stroke="var(--fig-curve-b)" stroke-width="2"/>
  <text x="120" y="188" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)" text-anchor="middle">horizontal</text>
  <text x="290" y="75" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)" text-anchor="middle">incline</text>
  <text x="340" y="195" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)">V →</text>
  <polygon points="370,165 385,170 385,160" fill="var(--fig-curve-a)"/>
</svg>