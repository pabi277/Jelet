<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="JELET 2025 Q62: heating curve">
  <rect x="0" y="0" width="420" height="220" fill="transparent"/>
  <text x="20" y="22" font-family="var(--font-mono)" font-size="12" fill="var(--fig-text)">Q62: Heating curve (T vs Heat input)</text>
  <line x1="60" y1="180" x2="360" y2="180" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="60" y2="40" stroke="var(--fig-axis)" stroke-width="1.5"/>
  <text x="365" y="185" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)">Heat input</text>
  <text x="50" y="35" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)">T</text>
  <!-- Segments: A-B (liquid heating), B-C (melting), C-D (liquid heating), D-E (vapor heating) -->
  <polyline points="60,170 120,140 180,140 240,80 300,80 360,40" stroke="var(--fig-curve-a)" stroke-width="2.5" fill="none"/>
  <circle cx="60" cy="170" r="3" fill="var(--fig-curve-a)"/>
  <circle cx="120" cy="140" r="3" fill="var(--fig-curve-a)"/>
  <circle cx="180" cy="140" r="3" fill="var(--fig-curve-a)"/>
  <circle cx="240" cy="80" r="3" fill="var(--fig-curve-a)"/>
  <circle cx="300" cy="80" r="3" fill="var(--fig-curve-a)"/>
  <circle cx="360" cy="40" r="3" fill="var(--fig-curve-a)"/>
  <text x="55" y="195" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)">A</text>
  <text x="115" y="155" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)">B</text>
  <text x="175" y="155" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)">C</text>
  <text x="235" y="95" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)">D</text>
  <text x="295" y="95" font-family="var(--font-mono)" font-size="9" fill="var(--fig-label)">E</text>
  <text x="260" y="35" font-family="var(--font-mono)" font-size="9" fill="var(--fig-curve-c)" text-anchor="middle">slope of DE = 1/C_vapour</text>
</svg>