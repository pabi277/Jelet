<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220" role="img" aria-label="JELET 2025 Q81: organic compound structure">
  <rect x="0" y="0" width="420" height="220" fill="transparent"/>
  <text x="20" y="22" font-family="var(--font-mono)" font-size="12" fill="var(--fig-text)">Q81: Compound structure</text>
  <!-- Skeletal structure: CH3-CH(CH3)-CH2-CH=CH-CH2-C≡CH (hept-1-en-4-yne with methyl) -->
  <polyline points="60,110 110,110 110,70 160,70 160,150 210,150 210,110 260,110" stroke="var(--fig-curve-a)" stroke-width="2.5" fill="none"/>
  <!-- Triple bond -->
  <line x1="260" y1="110" x2="280" y2="110" stroke="var(--fig-curve-a)" stroke-width="2.5"/>
  <line x1="270" y1="100" x2="270" y2="120" stroke="var(--fig-curve-a)" stroke-width="2.5"/>
  <line x1="275" y1="100" x2="275" y2="120" stroke="var(--fig-curve-a)" stroke-width="2.5"/>
  <!-- Double bond -->
  <line x1="160" y1="150" x2="180" y2="150" stroke="var(--fig-curve-a)" stroke-width="2.5"/>
  <line x1="165" y1="142" x2="175" y2="142" stroke="var(--fig-curve-a)" stroke-width="2.5"/>
  <line x1="165" y1="158" x2="175" y2="158" stroke="var(--fig-curve-a)" stroke-width="2.5"/>
  <!-- Methyl branch -->
  <line x1="110" y1="70" x2="110" y2="40" stroke="var(--fig-curve-a)" stroke-width="2.5"/>
  <line x1="110" y1="40" x2="130" y2="40" stroke="var(--fig-curve-a)" stroke-width="2.5"/>
  <!-- Terminal CH3 -->
  <line x1="60" y1="110" x2="40" y2="110" stroke="var(--fig-curve-a)" stroke-width="2.5"/>
  <text x="200" y="185" font-family="var(--font-mono)" font-size="10" fill="var(--fig-label)" text-anchor="middle">CH₃-CH(CH₃)-CH₂-CH=CH-CH₂-C≡CH</text>
</svg>